services:

  modsecurity-waf:
    image: owasp/modsecurity-crs:nginx
    container_name: modsecurity-waf

    ports:
      - "8082:8080"

    environment:
      BACKEND: http://web-dvwa:80
      PORT: "8080"

    volumes:
      - ./dynamic_rules.conf:/etc/modsecurity.d/owasp-crs/rules/zz_dynamic_rules.conf:ro

    networks:
      - zapnet

    restart: unless-stopped


networks:

  zapnet:
    external: true
    name: authenticated-dast-zap-final_zapnet