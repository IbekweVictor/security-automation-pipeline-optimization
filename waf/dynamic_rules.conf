# ============================================================
# Dynamic WAF Rules
# Project:
# Optimization of Security Automation Pipeline for
# Vulnerability Detection and Mitigation in Web Application
#
# WAF Engine:
# OWASP ModSecurity Core Rule Set (CRS)
#
# Purpose:
# Additional project-specific protection rules applied on top
# of the standard OWASP CRS rules.
# ============================================================


# ------------------------------------------------------------
# SQL Injection Protection
# ------------------------------------------------------------

SecRule ARGS "@rx (?i)(union\s+(all\s+)?select|select\s+.*\s+from|insert\s+into|delete\s+from|drop\s+table|update\s+.*\s+set)" \
    "id:1001001,phase:2,deny,status:403,log,msg:'Project WAF: SQL injection pattern detected'"


# ------------------------------------------------------------
# Cross-Site Scripting Protection
# ------------------------------------------------------------

SecRule ARGS "@rx (?i)(<script[^>]*>|</script>|javascript\s*:|onerror\s*=|onload\s*=|onmouseover\s*=)" \
    "id:1001002,phase:2,deny,status:403,log,msg:'Project WAF: XSS pattern detected'"


# ------------------------------------------------------------
# Path Traversal Protection
# ------------------------------------------------------------

SecRule ARGS "@rx (\.\./|\.\.\\\\|%2e%2e%2f|%2e%2e%5c)" \
    "id:1001003,phase:2,deny,status:403,log,msg:'Project WAF: Path traversal pattern detected'"


# ------------------------------------------------------------
# Command Injection Protection
# ------------------------------------------------------------

SecRule ARGS "@rx (?i)(;\s*(cat|ls|pwd|whoami|id|uname)|\|\s*(cat|ls|pwd|whoami|id|uname)|`[^`]+`)" \
    "id:1001004,phase:2,deny,status:403,log,msg:'Project WAF: Command injection pattern detected'"


# ------------------------------------------------------------
# Local File Inclusion Protection
# ------------------------------------------------------------

SecRule ARGS "@rx (?i)(/etc/passwd|/etc/shadow|/proc/self/environ|php://input|php://filter)" \
    "id:1001005,phase:2,deny,status:403,log,msg:'Project WAF: Local file inclusion pattern detected'"


# ------------------------------------------------------------
# Sensitive File Access Protection
# ------------------------------------------------------------

SecRule REQUEST_URI "@rx (?i)(/\.env|/\.git/|/\.gitconfig|/composer\.json|/package-lock\.json)" \
    "id:1001006,phase:2,deny,status:403,log,msg:'Project WAF: Sensitive file access detected'"


# ------------------------------------------------------------
# Basic Scanner / Enumeration Protection
# ------------------------------------------------------------

SecRule REQUEST_URI "@rx (?i)(/phpinfo\.php|/server-status|/\.htaccess|/wp-config\.php)" \
    "id:1001007,phase:2,deny,status:403,log,msg:'Project WAF: Sensitive endpoint enumeration detected'"


# ------------------------------------------------------------
# HTTP Method Protection
# ------------------------------------------------------------

SecRule REQUEST_METHOD "!^(?i:(GET|POST|HEAD|OPTIONS))$" \
    "id:1001008,phase:1,deny,status:405,log,msg:'Project WAF: HTTP method not permitted'"


# ------------------------------------------------------------
# Suspicious User-Agent Protection
# ------------------------------------------------------------

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan)" \
    "id:1001009,phase:1,deny,status:403,log,msg:'Project WAF: Suspicious scanner user-agent detected'"


# ------------------------------------------------------------
# Security Logging
# ------------------------------------------------------------

SecRule TX:ANOMALY_SCORE "@gt 0" \
    "id:1001010,phase:2,pass,log,msg:'Project WAF: OWASP CRS anomaly score detected'"